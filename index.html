<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="apple-touch-icon" href="/avatar.jpeg" />
    <link rel="mask-icon" href="/safari-pinned-tab.svg" color="#60a5fa" />
    <meta name="theme-color" content="#ffffff" />
    <meta name="msapplication-TileColor" content="#00aba9" />
    <title>文博知浅</title>
    <meta property="og:title" content="文博知浅的博客" />
    <meta property="og:image" content="/og-image.png" />
    <script>
      ;(function () {
        const prefersDark =
          window.matchMedia &&
          window.matchMedia('(prefers-color-scheme: dark)').matches
        const setting = localStorage.getItem('vueuse-color-scheme') || 'auto'
        if (setting === 'dark' || (prefersDark && setting !== 'light')) {
          document.head.querySelector('meta[name=theme-color]').content =
            '#000000'
          document.documentElement.classList.toggle('dark', true)
        }
      })()
    </script>
  </head>
  <body class="font-sans">
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
    <noscript>
      This website requires JavaScript to function properly. Please enable
      JavaScript to continue.
    </noscript>
  </body>
</html>
